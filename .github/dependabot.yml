version: 2

updates:
  # Dépendances npm / pnpm du monorepo (racine + workspaces)
  - package-ecosystem: npm
    directory: '/'
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      minor-and-patch:
        update-types: [minor, patch]

  # Actions GitHub utilisées dans les workflows
  - package-ecosystem: github-actions
    directory: '/'
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ['*']

  # Images de base des Dockerfiles
  - package-ecosystem: docker
    directory: '/apps/web'
    schedule:
      interval: weekly
  - package-ecosystem: docker
    directory: '/apps/api'
    schedule:
      interval: weekly
