sonar.organization=matthieuschoen
sonar.projectKey=matthieuschoen_covid-data-viz
sonar.projectName=CovidDataViz

sonar.sources=apps/web/src,apps/api/src,packages/shared/src
sonar.tests=apps/web,apps/api,packages/shared
sonar.test.inclusions=**/*.test.ts,**/*.test.tsx,**/*.spec.ts,**/*.spec.tsx
sonar.exclusions=**/node_modules/**,**/.next/**,**/dist/**,**/coverage/**,**/prisma/migrations/**,apps/web/src/components/ui/**

# Rapports de couverture lcov (générés par Vitest : reporter "lcov")
sonar.javascript.lcov.reportPaths=apps/web/coverage/lcov.info,apps/api/coverage/lcov.info,packages/shared/coverage/lcov.info
sonar.coverage.exclusions=**/*.test.*,**/*.spec.*,apps/web/src/components/ui/**,**/prisma/**

sonar.sourceEncoding=UTF-8
